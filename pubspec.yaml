name: emtilak
description: "واجهة أولية لتطبيق امتلاك لإدارة العقارات."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  introduction_screen: ^4.0.0
  shared_preferences: ^2.3.0
  flutter_native_splash: ^2.4.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  # 7.1.8+ يبني بأدوات هذا المشروع (Built-in Kotlin)؛ الإصدارات الأقدم (6.x)
  # تستخدم AGP 7.1.2 القديمة فتفشل ترجمة Java (android.jar غير مضافة).
  flutter_facebook_auth: ^7.2.0
  local_auth: ^3.0.2
  # نفس الإصدار المثبَّت أصلاً كتنفيذ مُعتمد لـ local_auth — يُستخدم لنصوص العربية
  # في نافذة طلب البصمة.
  local_auth_android: ^2.2.0
  # 10.3.x مطلوبة للتوافق مع flutter_facebook_auth 7.x (facebook_auth_desktop).
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/onboarding/
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
